# Gate E1 R0 팔 r3_625_ew0_5 — gate_e1.py configs 가 configs/v2_1.yaml 에서 만들었다. 손으로 고치지 않는다.
# 바꾼 계수(그 밖은 configs/v2_1.yaml 과 같다): 뛰기 대사 배수 R = 3.625 (걷기 배수 1 고정) →
#   c_rest = (21 − 4(R − 1))/21 = 0.5, c_move = 25(R − 1)/21 = 3.125
#   대사 배수 [정지, 걷기, 뛰기] = [0.5000, 1.0000, 3.6250], 걷기 섭식 배수 e_walk = 0.5
version: '2.1'
overrides: {}
features:
  speed:
    enabled: true
    thresholds:
    - 0.3333333333333333
    - 0.6666666666666666
    gait_speed:
    - 0.0
    - 0.4
    - 1.0
    gait_eat:
    - 1.0
    - 0.5
    - 0.0
    c_rest: 0.5
    c_move: 3.125
    net_energy_reward: true
train:
  num_worlds: 8
  reset_interval: 4000
  rollout_world_steps: 256
