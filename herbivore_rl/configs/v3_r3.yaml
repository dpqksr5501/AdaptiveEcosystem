# v3 R3 (학습 세계) — 현실성 세계에서 다시 배우기 (명세 AdaptiveEcosystem/Docs/RL_Policy/RL_V3_R3_SPEC.md, 사람 결정 10-14 = 그 문서 14절의
# 답). 개체가 결정 때마다 행동 하나(먹기·도망·숨기)를 고르는 정책을 PPO 로 배운다(train_v3.py). 판정 세계는 configs/v3_r3_on.yaml
# (낮 고정 세계 비율만 0).
# configs/v3_r1.yaml(R1b 를 배운 세계, 낮 고정 20%)에서 바꾼 것 (tests/test_r3_world.py 가 나머지 줄이 같은지 확인한다):
#   - version 3.r1 → 3.r3
#   - 현실성 규칙 다섯(1단계 값, configs/v3_real1_on.yaml) — 둘만 바꿨다: 청각 cap_to_sight false(H3), 은신처 먹이 배수 f ~ U[0.1, 0.3]
#     세계마다(frac_range, H7)
#   - R3 새 규칙: 추격 고정 realism_chase(H6 처음부터 켬), 늑대 은신처 진입 금지 realism_shelter.block_predators(H17), 지형 구역
#     realism_terrain(H18 명세 기본값, 사슴은 지형을 관측하지 않음 H19)
#   - 세로 장애물 자리 블록(obstacles, 끔)
#   - train.repertoire.allowed: [graze, flee, hide, freeze] → [graze, flee, hide] (사용자 '사슴 얼기를 없애'), f_dec·ent_coef_base 를 이 세계에서
#     다시 잼
# 그대로 둔 것: 늑대 식욕(포만 없음, 식사 쿨다운 5), 깜깜하면 새 사냥 없음(hunt_dark 1.0, H2), 동족 시야 120°(H4), 관측 18칸·마스크 판 2,
# 보상, 잠(SLEEP) 막힘(H8 은 나중에 다시 잰다). 나무·바위는 넣지 않는다. c_still(정지 탐지)은 FREEZE·도착 HIDE·SLEEP 에 걸리는 규칙인데,
# 이 세계에서 FREEZE·SLEEP 은 막히고 도착 HIDE 는 늘 은신처 안(표적에서 빠짐)이라 실제로 쓰이지 않는다.
# 시드: 실험은 보정 20000~20019·탐색 32000~32099 만 쓴다. R3 관문 판정 15000~15039·최종 판정 10300~10319 는 사전 등록 전에 쓰지 않는다.
# 학습 세계에 없던 규칙이 많다 — 언리얼에 실으려면 규칙 다섯 + 추격 고정 + 진입 금지가 모두 C++ 에 있어야 한다(명세 12절. 지형만 예외:
# 지형이 없는 언리얼은 학습 범위 안의 '지형 0%' 세계다).

version: "3.r3"

# v1 키 가운데 포식자 속도 범위 하나만 바꾼다 (10-02 사람 결정, Gate E1-b). v1 configs/default.yaml 은 그대로다.
#   rand.pred_speed_mult (herb_speed 대비, reset 마다 균등): v1 [0.8, 1.2] → [0.6, 0.95].
#   이유: E1 R0·R1 실패. 사전 등록 밖 소수 침입 시험(results/v2/e1/report.md 8절)에서 ×0.8~1.2 는 뛰기 속력 1.0 이
#   포식자 범위의 가운데라 뛰어도 절반의 세계에서 포식자보다 빠르지 않았고 뛰기의 개체 이득이 작았다(피식 −10%).
#   ×0.6~0.95 면 피식 −23%(t −6.04). 그래서 '걷기(0.4) < 근접 포식자 < 뛰기(1.0)' 구조로 둔다.
#   근접형 속력 = herb_speed × pred_speed_mult = ×0.60~0.95.
#   원거리형 속력 = herb_speed × pred_speed_mult × pred_ranged_speed_mult(0.6, v1 값 그대로 — 덮지 않는다)
#     = ×0.36~0.57 (v1 범위에서는 ×0.48~0.72). pred_speed_mult < 2/3 인 세계(균등 분포라 약 19%)에서는 원거리형이
#     걷기(0.4)보다 느리다. 뛰기(1.0)는 모든 포식자보다 빠르다.
#   rand 의 다른 하위 키(world_size, predator_count, ranged_frac, cover_frac, food_regen_mult)는 v1 값 그대로다.
#   overrides 는 묶음 키의 하위 키만 덮는다(env_v2/config.py). 시드마다 같은 uniform 한 번을 뽑으므로 같은 시드의
#   세계 배치(크기, M, 원거리형, 은신처, 재생, 위치)는 v1·v2.0 과 같고 배수만 0.6 + 0.875·(v1 배수 − 0.8)로 옮겨진다.
overrides:
  rand:
    pred_speed_mult: [0.6, 0.95]

features:
  speed:
    enabled: true
    # 행동 idx 4 (sigmoid 뒤 [0,1]) → 보행 상태: a < 1/3 정지, a < 2/3 걷기, 그 이상 뛰기 (계획서 4.3).
    # 상태가 없는 고정 문턱이다(최소 유지 시간 K 없음, 10절 #3 — B8 이 0.5 를 넘으면 넣는다).
    # 1/3·2/3 의 float64 값을 그대로 적는다(repr(1/3), repr(2/3)).
    thresholds: [0.3333333333333333, 0.6666666666666666]
    # 상태별 속력 × herb_speed [정지, 걷기, 뛰기] (4.4 표). 정지는 0 이어야 한다(heading 유지).
    # 뛰기 1.0 = v1 속력. 포식자 속도 범위는 E1-b 결정(10-02)으로 ×0.6~0.95(원거리형 ×0.36~0.57, 위 overrides)다.
    # 걷기 0.4 는 모든 근접형보다 느리고 뛰기 1.0 은 모든 포식자보다 빠르다. 쫓기면 뛰어야 산다.
    gait_speed: [0.0, 0.4, 1.0]
    # 상태별 섭식 배수 [정지, 걷기, 뛰기] (4.4 표). env_v2/world.py `_eat` 의 want(흡수 가능량, 상한 food_eat_rate
    # 0.06)에 곱한다. 걷기 최대 섭취 0.03/스텝.
    gait_eat: [1.0, 0.5, 0.0]
    # 대사 drain = energy_drain × (c_rest + c_move·(v/herb_speed)²) (4.4). 기준은 "평시 에너지 예산을 v1 과 같게":
    # 걷기 대사 = v1 대사(c_rest + 0.4²·c_move = 1)와 c_rest/c_move = 0.4²(거리당 비용이 가장 낮은 속도
    # √(c_rest/c_move)·herb_speed = 걷기 속도)에서 c_rest 0.5, c_move 3.125 (제안). 대사 배수는 정지 0.5, 걷기 1,
    # 뛰기 3.625. Gate E1 은 뛰기 배수 R ∈ {2, 3.6, 6} 을 훑는다 — 걷기 1 을 지키면 c_move = (R − 1)/0.84,
    # c_rest = 1 − 0.16·c_move.
    # 10-02 Gate E1-b 통과(B1 r2_5_ew0_5, results/v2/e1/judge_e1b.md·report_b.md)로 R = 2.5 값으로 바꿨다:
    #   c_rest = (21 − 4·1.5)/21 = 15/21, c_move = 25·1.5/21 = 37.5/21 (gate_e1.metabolism(2.5) 의 float64 값 그대로).
    #   대사 배수는 정지 0.714, 걷기 1(= v1, 그대로), 뛰기 2.5. 걷기 1 고정은 지키고 c_rest/c_move = 0.4 라
    #   거리당 비용이 가장 낮은 속도는 √0.4 ≈ 0.63·herb_speed(걷기와 뛰기 사이)이고, 걷기와 뛰기의 거리당 대사가
    #   같다(1/0.4 = 2.5/1). 뛰기의 비용은 대사가 아니라 섭식 0(gait_eat)에서 온다.
    c_rest: 0.7142857142857143
    c_move: 1.7857142857142858
    # 에너지 보상 (4.5, 10절 #4): true = 순변화 e_new − e_prev (번식·리스폰 리셋 제외. 대사가 즉시 보상에 잡힌다),
    # false = v1 획득량 e_new − e_drained (먹이로 얻은 에너지만).
    net_energy_reward: true

  daynight:
    enabled: true
    # 하루 길이 T(스텝) 목록. reset 마다 하나를 고른다(계획서 4.9.2 {600, 900, 1800} = 80·120·240초, 낮·밤 1:1).
    periods: [600, 900, 1800]
    # 전환 앞뒤 박명 폭(T 비율). 전환 순간 d = 0.5, 앞뒤 0.05·T 스텝(30·45·90)에 걸쳐 0 과 1 을 선형으로 잇는다.
    twilight: 0.05
    # 밤 효과 (1 − x·d) 의 x (계획서 4.9.2 (a)(b)(c), #21). Gate N (a2)·(a3)가 실패한 항은 0 으로 뺀다(사전 등록).
    #   detect_night: 초식의 포식자 탐지 반경 see_r·(1 − 0.5·d) (밤 10 < 포식자 시야 14). 동족 시야는 그대로다
    #   eat_night: 섭식 × (1 − 0.5·d) — 10-06 환경 확인 N(results/v2/v2_4/gate_n, N0 회차)에서 (a2) 밤/낮 섭취비가 0.878
    #     (C2, 기준 ≤ 0.8)로 실패해 사전 등록(PREREG 2절, #21)대로 0 으로 뺐다(제안값 0.5). 흡수 가능량 제한 때문에 섭취가
    #     대사 수요를 따라가 밤 섭식 감소가 하루 섭취를 거의 줄이지 못한다(계획서 4.9.2 예측대로)
    #   rest_night: 정지·비경계 개체의 휴식 대사 × (1 − 0.35·d) — N0 (a3) 통과(늘 정지 상수 CSTOP, t −14.99)
    #   detect_night 는 N0 (a1) 통과(도주 반경 see_r 상수 C2F, t 5.16)로 계약값 그대로다
    detect_night: 0.5
    #   v2.4s(10-07): 포식자가 밤에 자면 밤이 가장 안전한 식사 시간이 되므로, 초식도 밤에 잘 이유로 eat_night 을 0.9 로
    #     다시 켠다(밤 섭취 상한 ×0.1). 위 10-06 N0 의 0 은 v2.4 판정이다. v2.4s 환경 확인(results/v2/v2_4/s)에서 다시 잰다
    eat_night: 0.9
    rest_night: 0.35
    # 낮 고정 세계 비율(#27 기능 꺼진 세계: 낮 고정 20%). 낮 고정 세계는 d = 0 이고 관측 두 칸이 중립값 1·1 이다.
    fixed_day_frac: 0.2
    # to_transition = 다음 전환까지 남은 스텝 / 900 (계약 상수 — 가장 긴 상 길이, 계획서 4.2)
    transition_norm: 900
    # 시작 상태 유도(탐침 대응 1회용, results/v2/v2_4/MEMO.md). 0 = 끔
    start_induce: 0.0
    # 휴식 할인을 은신처 안에서 멈춘 개체만 받나(v2.4b, 10-06 추가 — false = v2.4 그대로, features.py 규칙 5)
    rest_cover_only: true

  pred_sleep:
    enabled: true
    # 야행성 비율 q 범위 — reset 마다 q ~ U[하, 상], 포식자마다 확률 q 로 야행성(밤에도 v2.4 그대로 사냥). 나머지는 주행성
    nocturnal_frac: [0.0, 0.25]
    # 주행성 포식자가 자는 어둠 문턱(d ≥ 0.5 = 해 진 뒤): 멈추고 사냥하지 않고 초식 시야에 보이지 않는다(굴)
    sleep_dark: 0.5
    # 깨어 있는 주행성 포식자의 속력 × (1 − d) (박명에 느려진다)
    twilight_slow: true

  # ── v3 R0 (명세 AdaptiveEcosystem/Docs/RL_Policy/RL_V3_R0_SPEC.md, 사전 등록 results/v3/r0/PREREG.md) ──────────────
  # 아래 두 블록을 끄면(enabled: false) 위 v2.4s 세계와 비트 단위로 같다(tests/test_repertoire_v3.py).
  repertoire:
    enabled: true
    # 잠금(최소 유지, 스텝 = 0.133초, 명세 2절). 잠금이 끝나거나 사건이 생기면 결정 시점이다(행동을 강제하지 않는다)
    lock_graze: 12
    lock_flee: 8
    lock_freeze: 12
    # HIDE: 도착까지 최대 hide_travel_max 스텝 잠그고, 도착(웅크림)한 뒤 lock_hide 스텝 더 잠근다
    lock_hide: 12
    hide_travel_max: 40
    # SLEEP: 진입 3 → 최소 수면 60 → 기상 3 (기상 중에는 움직이지 못하고 결정도 받지 않는다, M4)
    sleep_enter: 3
    sleep_hold: 60
    sleep_wake: 3
    # M2 놀람: GRAZE → FLEE 처음 3스텝 속력 0 (FREEZE·HIDE → FLEE 는 0)
    startle_steps: 3
    # M1 정지 탐지: FREEZE·도착 HIDE·SLEEP 의 표적 선택 체감 거리 × max(은신 배수, 1.8). GRAZE 정지에는 주지 않는다
    c_still: 1.8
    # M6 은신 배수(은신처 안일 때, 행동별): 웅크린(도착) HIDE 2.5, GRAZE 1.5, SLEEP 2.5, 그 밖(FLEE·FREEZE·가는 중 HIDE) 1.
    # 표적 선택과 포획 판정에 모두 쓴다(c_still 은 표적 선택에만). SLEEP 2.5 는 10-07 결정(results/v3/r0/PREREG.md 변경 기록
    # (n)): 은신처(굴) 안에서 자는 개체는 웅크린 개체처럼 숨겨진다 — 사용자 설계 '밤엔 굴에서 잔다'. 1 이면 은신처 안 잠이
    # 밖 잠과 똑같이 들켜 잠자리를 고를 이유가 없다
    # R1: 웅크림 은신 배수 4.0 은 R0 보정 1회차(results/v3/r0/cal1/hide)에서 HIDE 가 통과한 값이다
    cover_mult_crouch: 4.0
    cover_mult_graze: 1.5
    cover_mult_sleep: 2.5
    cover_mult_other: 1.0
    # M5 고개 숙임: GRAZE 중 자기 포식자 탐지 반경 × 0.6. SLEEP 은 × 0.3
    graze_head_down: 0.6
    sleep_sight: 0.3
    # 휴식 할인은 SLEEP 전용: 은신처 안의 SLEEP 대사 × (1 − 0.6·d). daynight.rest_night(0.35)는 이 세계에서 쓰지 않는다
    sleep_rest: 0.6
    # GRAZE: 지금 셀 먹이 ≥ 0.06(food_eat_rate)이면 멈춰 먹고 아니면 걷는다. 조향 n(0.83·먹이 기울기 + 0.71·무리 + 1.35·분리),
    # FLEE 는 n(3·위협 반대 + 0.71·무리 + 1.35·분리)
    graze_eat_min: 0.06
    graze_forage: 0.83
    graze_cohesion: 0.71
    # 사건 문턱: E2 위협이 8 안으로 들어오거나 접근 관측 ≥ 0.9, E4 에너지 < 0.25, E5 어둠 0.5 통과
    event_near: 8.0
    event_approach: 0.9
    event_energy: 0.25
    event_dark: 0.5
    # 사건 결정 지연 0~3스텝(개체 번호 해시, 해질녘에 무리가 한꺼번에 바뀌지 않게)
    decision_jitter: 3
    # 추가 관측: threat_recency 감쇠(v2.2 의 0.95), 행동 경과 분모 60. R1 은 관측에 넣는다(관측 9 + 9 = 18칸, 명세 1절)
    recency_decay: 0.95
    steps_norm: 60
    obs_extra: true

  threats:
    enabled: true
    # M3 잠행-돌진형: 세계마다 p_stalk ~ U[0.3, 0.7](포식자마다 이 확률로 잠행형, 나머지는 기존 추격형). 표적 체감 거리 > 6 이면
    # × 0.3 으로 몰래 접근, ≤ 6 이면 × 1.5 로 최대 12스텝 돌진, 놓치면 30스텝 탈진(× 0.2). 속력은 × herb_speed
    stalk_frac: [0.3, 0.7]
    stalk_dist: 6.0
    stalk_speed: 0.3
    pounce_speed: 1.5
    pounce_steps: 12
    exhaust_speed: 0.2
    exhaust_steps: 30
    # 플레이어형 위협(사용자 결정 10-07): 세계의 절반에 하나, 밤에 자지 않는다. 모드 [배회 × 0.4, 잠행 접근 × 0.3, 돌진 × 1.3].
    # 배회·잠행 모드는 200~400스텝마다 새로 고른다(잠행 확률 0.5). 잠행 중 가장 가까운 개체의 체감 거리가 6 이하면 최대 20스텝
    # 돌진하고 30스텝 쉰다. 포획 거리는 근접형과 같은 1.0, 포획 뒤 쿨다운 30스텝.
    # (명세에 값이 없는 것 — 모드 길이 범위, 잠행 확률, 돌진 시작 거리, 휴식, 쿨다운 — 은 R0 시작값이다)
    player_frac: 0.5
    player_speeds: [0.4, 0.3, 1.3]
    player_mode_steps: [200, 400]
    player_stalk_p: 0.5
    player_charge_dist: 6.0
    player_charge_steps: 20
    player_rest_steps: 30
    player_catch_r: 1.0
    player_cooldown: 30

  # ── v3 현실성 규칙 (1단계 규칙 다섯, 정의·식은 env_v2/world.py 모듈 docstring 'realism_*') ─────────────────────────────────────────
  # 값은 configs/v3_real1_on.yaml 과 같고 둘만 바꿨다(명세 3-2): 청각 자르기 풂(cap_to_sight false, H3), 은신처 먹이 배수를 세계마다 뽑음
  # (frac_range, H7). 늑대 식욕은 어느 규칙도 바꾸지 않는다(포만 없음, 쿨다운 pred_eat_cd 5 그대로 — 사용자 결정 '늑대는 과식하게 둔다').
  # (a) 시야: 위협(포식자·플레이어)을 보는 시야각. 반경은 그대로(see_r 20 × 밤 (1 − 0.5·d) × 행동 배수 GRAZE 0.6·SLEEP 0.3)
  #   현실 근거: 사슴은 눈이 머리 옆에 붙어 있어 수평 시야가 약 300~310°이고, 바로 뒤 50~60°만 사각이다.
  realism_vision:
    enabled: true
    # 300° = 앞쪽 ±150°. 바로 뒤 60°(±30°)는 보이지 않는다(그 사각은 청각이 메운다)
    threat_fov_deg: 300.0
    # 동족 시야각은 그대로 둔다(H4 — 120 = configs/default.yaml fov_deg). 넓히면 kin_count 가 포화하고 무리 모양이 바뀐다
    kin_fov_deg: 120.0

  # (b) 청각: 위협의 지난 스텝 걸음새·속력으로 소리 반경 R 을 정하고, R 안이면 방향과 무관하게 '감지됨'으로 관측(pred_count·pred_dist·
  #   pred_approach·threat_recency)과 사건 E1·E2 에 넣는다. 관측 18칸·값 범위는 그대로다.
  #   s = 지난 스텝 실제 이동 속력(× herb_speed). s′ = 전력 걸음(표적을 쫓는 추격형·원거리형, 잠행형 돌진, 플레이어 돌진)이면 s,
  #   아니면 min(s, s_quiet).  R = 0 (s′ < s_silent),  r_quiet + (r_loud − r_quiet)·clip((s′ − s_quiet)/(s_loud − s_quiet), 0, 1) (그 밖)
  #   눈·거친 땅에서 느려진 위협은 실제 이동이 줄어 저절로 조금 덜 멀리 들린다(지형이 소리 규칙을 바꾸지는 않는다).
  #   현실 근거: 전력으로 쫓는 늑대는 발 구르는 소리·덤불 스치는 소리가 커서 사슴이 사방으로 돌아가는 귀로 듣는다. 돌아다니거나
  #   살금살금 다가오는 늑대는 아주 가까이 와야 들리고, 서 있거나 자는 늑대는 걸음 소리가 없다.
  realism_hearing:
    enabled: true
    s_silent: 0.05
    s_quiet: 0.3
    s_loud: 1.0
    # 살금살금 움직이는 위협이 들리는 반경 2단위(약 4 m), 전력 질주하는 위협이 들리는 반경 20단위(약 40 m)
    r_quiet: 2.0
    r_loud: 20.0
    # 전력 걸음이 아닌 위협(배회·잠행·탈진)의 속력을 s_quiet 에서 자른다. 현실 근거: 늑대는 돌아다닐 때 조용한 속보로 걷고, 먹잇감을
    # 쫓을 때만 전력으로 달려 시끄럽다
    roam_quiet: true
    # R3 는 다시 배우므로 들리는 반경을 그 사슴의 시야 반경에서 자르지 않는다(H3). 밤에 귀가 어두워지지 않는다. 그래서
    # 'pred_dist ≤ visibility × 행동 배수' 결합은 이 세계에서 성립하지 않는다(밤에 풀을 뜯는 사슴도 20단위 안의 돌진을 듣는다)
    cap_to_sight: false

  # (c) 은신처 안전 + (c′) 늑대 은신처 진입 금지: 은신처 원 안의 사슴은 행동과 무관하게(안에서 풀을 뜯어도, 웅크려도) 어떤 위협도 잡지
  #   못하고 표적에서도 빠진다. 늑대와 플레이어형 위협은 은신처 원에 들어가지 못하고 원 둘레를 따라 미끄러진다(사슴은 드나든다).
  #   현실 근거: 빽빽한 덤불·바위틈 안으로는 늑대가 몸을 들이밀어 덮칠 수 없어 가장자리를 따라 돌아간다. 사슴은 몸을 낮춰 파고든다.
  #   나무·바위 같은 세로 장애물은 넣지 않는다(사용자 결정 10-14 — 아래 obstacles 자리 블록).
  realism_shelter:
    enabled: true
    # 은신처 안 사슴을 표적 고르기에서도 뺀다. 현실 근거: 늑대는 닿을 수 없는 먹잇감 대신 곧바로 다른 먹잇감을 노린다
    untargetable: true
    # 플레이어형 위협에도 적용한다(안전·진입 금지 둘 다, H14). 현실 근거: 플레이어도 같은 몸을 가진 포식자라 덤불 속으로 덮칠 수 없다
    player_too: true
    # (c′) 늑대 진입 금지(H17, 사람 결정 10-14): 이동 뒤 원 안이면 원 둘레 밖으로 밀어낸다(둘레 방향 성분은 남는다 — 미끄러짐). 그래도
    # 원 안이면 그 스텝은 제자리다. 1단계 설정(v3_real1_*.yaml)은 이 키가 없어 끔(false, env_v2/features.py OPTIONAL_KEYS)이다
    block_predators: true

  # (e) 은신처 먹이 부족: 은신처 셀(은신처 원과 조금이라도 겹치는 셀)의 먹이 용량과 재생 속도를 밖의 일부 f 로 둔다. 밖 셀은 그대로라
  #   풍부한 패치는 밖에 남는다. '숨으면 못 먹음' 규칙은 넣지 않는다 — 은신처 안 GRAZE 는 먹을 수 있고 안전하다.
  #   R3 는 세계마다 f ~ U[0.10, 0.30] 하나를 자기 스트림(realism_cover_food part 0)에서 뽑아 용량·재생에 함께 쓴다(H7). 어느 f 에서나 은신처
  #   먹이는 무리 수요의 몇 % 다(명세 4-2). 언리얼은 이 범위 안의 한 값을 설정으로 둔다.
  #   현실 근거: 빽빽한 덤불·숲 그늘 밑은 햇빛이 모자라 풀이 적고 더디게 자란다. 덤불마다 밑풀 양이 다르다.
  realism_cover_food:
    enabled: true
    # frac_range 를 쓰면 둘은 null 이다(세계마다 뽑은 f 하나가 둘을 정한다)
    cap_frac: null
    regen_frac: null
    frac_range: [0.1, 0.3]

  # (d) 늑대 밤잠 점진화(주행성만. 야행성·플레이어는 그대로 밤에 자지 않는다). 값은 1단계 그대로다.
  #   눕기: 해 진 뒤 늑대마다 다른 지연이 지나고, 사냥 중이 아니고, 실거리 settle_r 안에 사슴이 없으면 걸음을 늦추기 시작해 ramp_steps
  #   스텝 뒤에 눕는다. 깜깜하면(d ≥ hunt_dark) 새 사냥을 시작하지 않고 쫓던 사냥만 마저 끝낸다(H2 사람 결정 10-14: 둔다).
  #   현실 근거: 늑대는 해 질 녘에 사냥을 마저 끝내고 주위가 조용해지면 걸음을 늦추다 눕는다. 먹잇감이 가까이 있거나 쫓는 중이면
  #   눕지 않는다. 이 세계의 주행성 늑대는 낮에 사냥하는 무리라는 게임 설정이다(밤 사냥은 야행성 늑대가 맡는다).
  realism_night:
    enabled: true
    settle_r: 8.0
    hunt_dark: 1.0
    night_floor: 0.5
    spread: 0.5
    ramp_steps: 15

  # ── v3 R3 새 규칙 (사람 결정 10-14, 정의·식은 env_v2/world.py 모듈 docstring 'R3 세계') ─────────────────────────────────────────────
  # (f) 추격 고정(H6: 처음부터 켬, 명세 4-10): 쫓기 시작한 늑대는 그 사슴이 늑대 시야(14단위, 150°) 안에 있고 은신처 밖이면 표적을 바꾸지
  #   않는다 — 더 가까운 다른 사슴이 보여도 그 사슴을 쫓는다. 쥐는 위협 = 사냥 중(쿨다운 0·깨어 있음·hunt_dark 통과)인 추격형(근접·원거리)과
  #   돌진 중인 잠행형. 표적이 은신처에 들어가거나, 시야 밖이 lost_steps 스텝을 넘거나, 잡거나(표적이든 아니든), 표적이 죽거나, 쥘 수 없는
  #   상태(쿨다운·탈진·잠)가 되면 놓는다. 고정한 표적에는 체감 거리 배수(c_still·은신 배수)를 쓰지 않는다(실거리).
  #   현실 근거: 늑대는 무리에서 한 마리를 골라 그 개체가 보이는 한 끝까지 쫓는다. 쫓기던 사슴이 멈춰도 늑대 눈에서 사라지지 않고, 더
  #   가까운 옆 개체로 넘어가지 않는다. 덤불 속으로 뛰어든 먹잇감은 포기한다.
  realism_chase:
    enabled: true
    # 시야 밖이어도 놓지 않는 연속 포식자 스텝. 0 = 시야를 벗어난 스텝에 바로 놓는다(사용자 말 '보이는 동안 계속 쫓음', 명세 4-10 제안 —
    # 사전 등록에서 정한다). 0 보다 크면 놓친 뒤 마지막으로 본 자리까지 잠깐 더 달리고, 그동안 새 표적·새 돌진을 고르지 않는다
    lost_steps: 0
    # 잠행형의 잠행 접근(배회 상태에서 표적 쪽으로 몰래 다가감)에서는 고정하지 않는다 — 다가가는 동안에는 가장 좋은 기회를 고르다가,
    # 돌진을 시작하면 그 한 마리에 매달린다(명세 3-1 (f)·4-10)
    stalk_phase: false
    # 플레이어형 위협(학습의 사람 대역)에는 쓰지 않는다 — 사람은 스스로 표적을 고른다(명세 4-10 제안). true 면 돌진 모드에서 고정한다
    player_too: false

  # (h) 지형 구역(H18: 명세 기본값): 먹이 격자 셀(2단위 = 4 m)마다 보통·눈·거친 땅. 그 스텝 이동 전 위치 셀의 배수를 이동에 곱한다.
  #   사슴: 모든 행동의 이동 속도 × mult_herb. 늑대: 밤잠 배수 다음에 속력 × mult_pred, 플레이어형 위협은 mult_player. 대사·섭식은 보행
  #   상태로 정해 그대로다(같은 힘으로 덜 간다). 시야·소리 규칙·먹이·은신처 안전·늑대 식욕은 바꾸지 않는다. 사슴은 땅을 관측하지
  #   않는다(H19 — 관측 18칸 그대로). 세계마다 눈·거친 땅이 각각 25% 확률로 아예 없고(넓이 정확히 0), 아니면 눈 0~25%·거친 땅 0~15%
  #   목표까지 반지름 3~10단위 원판을 놓는다(은신처를 놓는 방식, 자기 스트림, 은신처·먹이와 독립). 거친 땅은 눈이 아닌 셀만 칠한다.
  #   언리얼 값(사슴 뛰기 900, 늑대 0.8배 720 cm/s): 눈 540 / 612, 거친 땅 720 / 648 cm/s — 눈에서는 늑대가 더 빠르다.
  #   현실 근거: 사슴은 몸무게에 비해 발굽이 작아 깊은 눈에 푹푹 빠지고, 늑대는 넓은 발로 몸무게를 나눠 덜 빠진다. 돌밭·자갈 비탈은 둘
  #   다 디딜 곳을 골라야 해 느려지고, 단단한 발굽이 발바닥 패드보다 잘 미끄러진다(근거는 눈보다 약하다 — 차이를 작게 둔다).
  realism_terrain:
    enabled: true
    # 넓이 목표(셀 비율) 범위 [하, 상] — '없음'이 아닌 세계에서 하나를 뽑는다
    snow_frac: [0.0, 0.25]
    rough_frac: [0.0, 0.15]
    # [눈, 거친 땅] 이 아예 없는 세계의 확률. 학습 세계의 약 6%(0.25 × 0.25)는 지형이 아예 없고, 약 19%는 눈만 있다
    zero_p: [0.25, 0.25]
    # 덩어리 원판 반지름 범위(단위, 6~20 m)와 땅마다 원판 수 상한(110단위 맵에서 눈 25%에 평균 약 24개)
    patch_r: [3.0, 10.0]
    max_patches: 64
    # 속력 배수 [보통, 눈, 거친 땅] — 사슴, 늑대(추격형·원거리형·잠행형 같음), 플레이어형 위협(늑대와 같게)
    mult_herb: [1.0, 0.6, 0.8]
    mult_pred: [1.0, 0.85, 0.9]
    mult_player: [1.0, 0.85, 0.9]

  # ── 세로 장애물(나무·바위) — 넣지 않는다(10-14 사용자: '나중에 추가 가능하게만'). 자리만 둔다(env_v2/world.py 모듈 docstring
  # '세로 장애물'). 은신처 원의 늑대 진입 금지(위 block_predators)는 은신처 원에만 쓰는 이동 제약이다 ───────────────────────────────────
  obstacles:
    enabled: false

train:
  # configs/v3_r1.yaml 과 같다(세계 8개, 교체 5000, rollout_world_steps 256).
  num_worlds: 8
  reset_interval: 5000
  rollout_world_steps: 256
  # v3 R3 이산 행동 학습 블록 (env_v2/rep_policy.py rep_params — 기본값 없음, 키를 모두 적는다). 관측 [세계 관측 18 | 마스크 5], 마스크 판 2.
  repertoire:
    # 고를 수 있는 행동(마스크 '허용'): 먹기·도망·숨기. 얼기(FREEZE)는 사용자 결정(10-14 '사슴 얼기를 없애. 얼기라는 게 말이 안 되잖아')으로
    # 뺐다. 잠(SLEEP)은 R0 부터 막혀 있고 H8(다시 재기)까지 그대로 막는다. 행동 번호 계약(0 GRAZE, 1 FLEE, 2 HIDE, 3 FREEZE, 4 SLEEP)은
    # 그대로이고 목록에 없는 행동은 마스크가 늘 막는다. 얼기가 든 목록으로 배운 R1b 를 이 세계에서 돌리면 판정 롤아웃(rep_learned)이
    # 모델 목록 ∩ 이 목록을 써서 FREEZE 를 막는다(env_v2/rep_policy.py effective_allowed). 목록을 바꾸면 f_dec 를 다시 잰다
    allowed: [graze, flee, hide]
    # ε 혼합 π′ = (1 − ε)·π + ε·U(m) (학습 표본·PPO 비율). 배포·판정은 argmax 라 ε 를 쓰지 않는다
    epsilon: 0.05
    # 시작 확률(로짓 편향 = log(p/Σp), 계약 순서 GRAZE·FLEE·HIDE·FREEZE·SLEEP). 막힌 FREEZE·SLEEP 칸은 나머지로 다시 맞춘다(R1 그대로)
    init_probs: [0.4, 0.15, 0.15, 0.15, 0.15]
    # 엔트로피 기준값 = 0.01 × f_dec — 범주 엔트로피 계수(= ent_coef_base ÷ f_dec)를 R1·R2 조리법의 0.01 그대로 둔다
    ent_coef_base: 0.00590998
    # 결정 비율 f_dec. 2026-10-14 이 설정(v3_r3)에서 잰 값이다: python train_v3.py measure-fdec --config configs/v3_r3.yaml
    # (시작 정책 = 모델 시드 0 의 무작위 가중치 + 시작 로짓 편향, 보정 시드 20000~20002 × 3000스텝, 목록 graze·flee·hide) → 0.590998
    # (시드별 0.5475·0.3818·0.8438, 결정 시점 중 마스크가 두 칸 이상인 비율 0.135). 기록 results/v3/r3/measure_fdec.log. 10-14 검토에서
    # 플레이어형 위협의 막다른 곳 포기 규칙을 더한 뒤 다시 쟀다(앞 값 0.584382 — 플레이어가 있는 시드 20000 만 0.5276 에서 바뀌었다). 청각이 '위협을
    # 안다'를 늘리고 얼기가 빠져 R1(판 2 로 다시 재면 0.736)·R2(0.573)와 다르다. 세계 규칙(특히 추격 고정·진입 금지)을 바꾸면 다시 잰다
    # 판정 세계(_on)는 학습하지 않지만 같은 블록을 둔다(판정 도구가 목록을 읽는다)
    f_dec: 0.590998
