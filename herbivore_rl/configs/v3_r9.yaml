# R9 세 종 학습 세계 (설계 AdaptiveEcosystem/Docs/RL_Policy/RL_R9_MULTISPECIES_DESIGN.md 3~7절). 판정 세계 = v3_r9_judge.yaml (inherit).
# 코드: env_v2/r9_body.py(몸 표·관측/행동 계약·해시) · r9_world.py(세계) · r9_life.py(생애·번식) · r9_brains.py(고정 두뇌·규칙 두뇌).
# 단위: 1 단위 = 2 m, 1 스텝 = 2/15 초, 결정 = 2 스텝, 하루 = 900 스텝. 속력은 단위/스텝 절대값이다(R8 처럼 사슴 뛰기 배수가 아니다).
#
# 몸 계약 해시는 species·body_common 두 블록만 본다. 판정 세계도 같은 두 블록을 써야 학습한 두뇌를 받는다 — 판정 전용 값은 judge 블록에 둔다.
# [C0-x] = 보정 관문이 고칠 값(설계 9-1). 지금 값 = 문서 첫 후보. 정하는 관문(C0-5·7 — C0-6 은 11-12 부터 보고만)은 '앞 관문은 뒤 관문의 가운데 후보로 잰다' 규칙이라
#          풀 재생은 가운데 후보 0.002 를 둔다(후보 차례의 첫 값과 같다).
# [어림] = 문서에 수가 없어 정한 값(계약 문서 impl_contract.md 와 보고서에 적음).
# S′ (사용자 결정 2026-11-12 '실전 세계랑 맞추고·그렇게 해·다 해'): 몸 = 할 수 있는 것만. EAT = 그 자리에서 서서 먹기, SHELTER = 제자리 서기
#   (EAT 걷기·SHELTER 자동 뛰기·찌꺼기 먹기 없음), 새 감각 food_dir 8 칸(관측 115). 연습 세계 분포 N: 풀 용량 합 70 · 사슴 16~40.

world:
  mode: train                   # train | judge (3-6)
  size: 60.0                    # 120 m 정사각, 벽
  decision_steps: 2             # 결정 = 2 스텝 = 0.27 초, 전역 t mod 2 = 0 에서 모든 종이 결정 (5절, 3-9 차례 0)
  quadrants: 1                  # 학습 세계는 셈 하나 (판정 세계 4)
  slots: {deer: 64, wolf: 6, boar: 14}   # 종별 칸 상한 = 학습 세계 최대 마릿수. 칸 차례 사슴 → 늑대 → 멧돼지 (3-6)
  carcass_slots: 48             # [어림] 세계마다 사체 칸. 차면 남은 고기가 가장 적은 사체를 지우고 넘침 수를 센다
  shelters:
    count: [3, 6]               # 3-1
    radius: [4.0, 7.0]
    min_gap: 18.0               # 중심끼리
    wall_gap: 8.0               # 중심이 벽(판정 세계: 사분면 경계)에서
    per_quadrant: 0             # 0 = 세계 전체에서 count 개 (판정 세계 4)
    tries: 2000                 # [어림] 자리 뽑기 시도 수
    fixed: null                 # [[x, y, r], ...] — 시험 20(R8 과 풀 비교)·장면 시험용 고정 배치
  wall_band: 4.0                # 8-4 벽 띠 (지표용)

placement:                      # [어림] 시작 배치 — 문서에 규칙이 없어 R8 꼴(r8_world._init_world)을 따른다
  wolf_gap: 10.0                # 늑대끼리 (R8 animals.min_gap)
  prey_from_wolf: 14.5          # 사슴·멧돼지는 늑대에서 (R8 deer.start_r)
  shelter_margin: 0.5           # 늑대는 은신처 원(r + 0.5) 밖, 사슴·멧돼지는 원 밖(0)
  tries: 200
  pack_r: 2.0                   # 판정 세계 늑대 무리: 둘째 늑대는 첫 늑대에서 이 거리 안

counts:                         # 상대 종 마릿수 범위 (3-8, 세계 시드가 정함)
  deer: [16, 40]                # S′ N (2026-11-12): 실전 사분면 사슴 24 둘레로 (예전 [16, 64])
  wolf: [1, 6]
  boar: [4, 14]

learner_counts:                 # 배우는 종 마릿수 = 세계 번호 k 로 (7-3: k mod 길이)
  deer: [16, 24, 32, 40]        # S′ N: 32 세계 × 평균 28 = 학습 칸 896, 롤아웃 896 × n_steps 32 = 28,672 = 7 × 4,096 (예전 16·32·48·64)
  wolf: [1, 2, 3, 4, 6]
  boar: [4, 6, 8, 14]

randomize:                      # 3-8 (학습 세계, 세계 시드 하나가 정함)
  grass_regen_mult: [0.5, 2.0]
  root_regen_mult: [0.5, 2.0]   # 풀과 따로 (열매 풍년·흉년)
  juvenile_frac: {deer: [0.1, 0.4], wolf: [0.0, 0.3], boar: [0.1, 0.4]}
  fat_init: [0.0, 1.0]          # 시작·다시 남 지방 몫 (갓난 꼴은 0)
  start_energy: 0.5             # 3-6 시작 몸 E
  rule_deer_facing: [0.8, 0.97] # RULE_DEER 바라봄 문턱 f (세계에 하나, 7-5)

respawn:                        # 3-6 학습 세계 '죽은 뒤'
  newborn_frac: 0.2             # 갓난 꼴: 나이 0·E 0.4·지방 0, 같은 종 성체 곁 1.1 + 0.2j 단위(황금각 표)
  far_r: 20.0                   # 나머지: 다른 종 모든 개체에서 20 단위 밖·은신처 밖
  candidates: 64                # 후보 64 개 중 첫 자리, 없으면 가장 먼 후보

food:
  cell: 2.0
  grass:                        # 사슴·멧돼지. R8 패치 생성기 복사(r8_world.py 303~313)
    patch_blur: 5
    patch_threshold: 0.6
    regen_base: 0.002           # [C0-7] 후보 0.002, 0.0015, 0.0025, 0.001, 0.003 (R8 0.026 은 쓰지 않는다 — 3-2)
    cover_mult: 0.15            # 은신처 셀 용량·재생 × 0.15
  root:                         # 멧돼지만. 따로 갈래 난수
    patch_blur: 5               # [어림] 문서는 문턱만 적었다
    patch_threshold: 0.7
    regen_q: 1.0                # [C0-5] 재생 = 풀 재생 기본값 × q. 후보 1, 0.5, 2, 0.25, 4
    cover_mult: 0.15
  quadrant_grass_total: null    # 판정 세계 70.0 (사분면 용량 합, 은신처 0.15 배 전)
  train_grass_total: 70.0       # S′ N (2026-11-12): 학습 세계 풀 용량 합 = 70 (판정 사분면과 같은 뜻, 은신처 0.15 배 전 합). null = 맞추지 않음.
                                # 판정 세계(mode judge)는 이 값을 읽지 않는다 (quadrant_grass_total 이 맡음)

body_common:                    # 세 종 공통 몸 규칙 (몸 해시에 들어간다)
  gait_drain: [0.714, 1.0, 2.5] # 서기·걷기·뛰기 대사 배수 (3-3, R8)
  stamina_lock: 0.15            # 이하면 잠김(뛰기 = 걷기 속력)
  stamina_unlock: 0.55          # 이상이면 풀림
  wound_speed: 0.5              # 속력 × (0.5 + 0.5 × HP)
  eat_min: 0.06                 # 격자 먹이가 셀에 이만큼이면 서서 먹는다 (R8 graze_eat_min). 땅속 먹이도 같은 값 [어림]
                                # S′: EAT 는 이것(또는 1.0 안 사체)이 발밑에 있을 때만 먹는다. 없으면 그냥 선다 (EAT 걷기 walk_eat_mult·graze 삭제)
  bite: {cone_cos: 0.5, approach_min: 0.03, cooldown: 8}  # 3-4: 머리 앞 ±60°, 이번 스텝 다가감 > 0.03, 문 뒤 8 스텝
  counter:                      # 3-4 멧돼지 정면 반격 (EcoFaunaMovement.cpp 208~223)
    hp_min: 0.35
    cone_cos: 0.25              # [C0-3] ±75.5°. 반격 몫이 높으면 60° (0.5), 낮으면 90° (0.0)
    damage: 0.18                # 늑대 HP − 0.18 × 멧돼지 몸 크기(유전 × 성장) × Lerp(0.2, 1, 나이비)
    age_lerp: [0.2, 1.0]
    knock_step: 0.25            # 늑대 밀림 0.25 단위 × 4 스텝 (접촉 변위)
    knock_steps: 4
    nobite_steps: 30            # 반격받은 늑대 물기 쉼
    self_damage: 0.05           # 반격한 멧돼지 HP − 0.05 [새][어림]
  bite_damage: {base: 0.45, mass_age_lerp: [0.12, 1.0]}  # 반격 못 함: HP − clamp(0.45 / (g_size³ × Lerp(0.12, 1, 나이비)), 0.45, 1)
  carcass:
    meat_frac: 0.6              # [C0-4] 고기 = 질량 × 0.6 ÷ 9 kg. 높으면 0.45, 낮으면 0.75
    kg_per_unit: 9.0            # 고기 1 단위 = 늑대 E 1
    places: 3                   # 먹는 자리 3 (Native 사체)
    eat_r: 1.0                  # 1.0 단위 안에서 서서 — 관측 here_r(food_here·food_dir 경계)와 같아야 한다(r9_body 검사)
    decay_steps: 1350           # 처음 고기의 1/1350 씩 사라짐 (1.5 일)
  shelter_push: 0.5             # 못 들어가는 몸은 은신처 원(r + 0.5) 밖으로 (접촉 변위)
  breed:                        # 3-7 (두 세계 같음)
    e_min: 0.7
    hp_min: 0.7
    gestation: 225              # 30 초
    recover: 2250               # 300 초
    retry: 225                  # 출산 실패(거리) 뒤 다시 (NB 54)
    cost: 0.2
    child_e: 0.4
    child_fat: 0.0
    scan_num: 2                 # 짝 찾기 = ⌊2t/75⌋ 가 바뀌는 스텝 (5 초마다)
    scan_den: 75
    generation_cap: 64          # NB 41 (세대 ≥ 64 이면 부모 자격 없음) [언]
    clear_r: 0.5                # 새끼 자리: 산 개체에서 0.5 단위(100 cm) 밖 (NB 69)

species:                        # 몸 표 3-3 (성체 기준). 몸 해시에 들어간다
  deer:
    mass_kg: 60.0
    founder: natural            # NaturalFounder(씨앗, ID, 변이) — LH 51~56
    founder_variation: 0.08     # 0.92~1.08 (EcoNaturalHabitatProfile.h 48)
    growth: smooth              # 0.75 → 1 smoothstep (LH 196~201)
    walk_speed: 0.24            # 3.6 m/s (R8 먹기 걸음)
    run_speed: 0.60             # 9 m/s
    run_mult: [1.0, 1.0]
    accel: 0.12                 # [어림]
    stamina_run_steps: 90       # [C0-1] 90 → 120 → 60. [어림]
    stamina_recover_steps: 60   # 0.15 → 0.55 [어림]
    see_r: 20.0
    fov_deg: 300.0
    head_down: 0.6              # EAT 중 눈 × 0.6 (감각·food_dir 모두)
    smell_r: 3.0
    drain: 0.002                # 걷기 E/스텝
    reserve_days: 3.0           # 지방 용량 = 3 일 × 900 × 대사 = 5.4
    refill_e: 0.7
    refill_frac: 0.25
    weak_e: 0.1
    weak_speed: 0.75
    diet: [grass]
    eat_rate: {grass: 0.012}    # 단위/스텝. C0-6 보고만 — 0.012 고정(11-12, 처음 후보 표 0.009·0.016·0.007·0.020 은 쓰지 않음)
    e_per_unit: {grass: 0.5}
    has_hp: false               # 물리면 죽음
    hp_regen_per_day: 0.0
    shelter_enter: true
    bites: []
    bite_r: 0.0
    counter: false
    maturity_steps: 2700        # 360 초
    sex: natural                # 암컷 = Unit(씨앗 ^ Mix(ID + 911)) < 0.6
    female_frac: 0.6
    child_female_frac: 0.6
    max_founder_age_steps: 13500  # 1800 초 (FPopulationProfile)
    first_birth: [112.5, 450.0] # 시작·다시 남 개체 다음 번식 = t + 112.5 + 450 × Unit(S_q ^ ID)
    mate_r: 10.0
    birth_r: 15.0
    birth_grace_steps: 0
    pair_block: [run, shelter]  # 짝 맺을 때만 (3-7, RL-6)
    birth_block: []
    pending_needs_parent: true  # 대기 중: 살아 있음·사분면·E·HP 자격
    child_ring: {center: parent_a, r0: 1.1, dr: 0.2, avoid_shelter: false}
    food_density_ref: 0.5       # [어림] 문서 '종별 기준값' 미정 — 풀만이면 R8 food_density(블러 평균 단위)와 같아지게
    food_here_ref: 0.5          # [어림] food_here 와 food_dir(x / (x + 이 값)) 기준값
  wolf:
    mass_kg: 40.0
    founder: plain              # Founder(씨앗, ID): 0.95~1.05 (LH 49~50)
    founder_variation: null
    growth: linear
    walk_speed: 0.18            # 2.7 m/s
    run_speed: 0.60
    run_mult: [0.90, 1.05]      # [C0-2] 세계에 하나 U[lo, hi]. 성공률 높으면 [0.85, 1.00], 낮으면 [0.95, 1.10]
    accel: 0.10                 # [어림]
    stamina_run_steps: 300      # [어림]
    stamina_recover_steps: 60   # [어림]
    see_r: 20.0
    fov_deg: 250.0
    head_down: 0.6
    smell_r: 5.0
    drain: 0.0003               # Native 0.00225/초
    reserve_days: 3.0           # 0.81 [새]
    refill_e: 0.7
    refill_frac: 0.25
    weak_e: 0.1
    weak_speed: 0.75
    diet: [meat]
    eat_rate: {meat: 0.016}     # 0.12/초 — 고기 1 단위 = E 1
    e_per_unit: {meat: 1.0}
    has_hp: true                # [새]
    hp_regen_per_day: 0.25      # [새][어림]
    shelter_enter: false
    bites: [deer, boar]         # 멧돼지 사냥 [새]
    bite_r: 1.0                 # × 유전 크기 × 성장 (CatchRadius × BodyScale)
    counter: false
    maturity_steps: 1350        # 180 초
    sex: none
    female_frac: 0.0
    child_female_frac: 0.0
    max_founder_age_steps: 6750 # [어림] 5 × 성숙 (사슴 비율). 노화가 없어 결과에는 영향이 없다
    first_birth: [0.0, 0.0]     # 시작 늑대는 곧바로 (NextBirth 0)
    mate_r: 10.0
    birth_r: 15.0
    birth_grace_steps: 0
    pair_block: []              # 늑대에게 뛰기는 사냥이다 (3-7)
    birth_block: []
    pending_needs_parent: true
    child_ring: {center: parent_a, r0: 1.1, dr: 0.2, avoid_shelter: true}   # 은신처 안 금지 (NB 66)
    food_density_ref: 0.00907   # [어림] 성체 사슴 사체 고기 4.0 ÷ 441 셀 → 사체 하나 ≈ 1
    food_here_ref: 4.0          # [어림]
  boar:
    mass_kg: 80.0
    founder: plain
    founder_variation: null
    growth: smooth
    walk_speed: 0.0866667       # Pig 130 cm/s (문서 표의 0.087 은 반올림)
    run_speed: 0.42             # 6.3 m/s (사슴의 0.7 배)
    run_mult: [1.0, 1.0]
    accel: 0.06                 # Pig 680 cm/s²
    stamina_run_steps: 70.8333333   # Fauna −0.09/초 그대로 (문서 표 71 은 반올림)
    stamina_recover_steps: 23.0769231   # +0.13/초 그대로 (표 23)
    see_r: 8.0
    fov_deg: 300.0
    head_down: 0.6
    smell_r: 6.0
    drain: 0.000466667          # Fauna 0.35/초 ÷ 100
    reserve_days: 3.0           # 1.26 [새]
    refill_e: 0.7
    refill_frac: 0.25
    weak_e: 0.1
    weak_speed: 0.75
    diet: [root, meat, grass]   # 먹는 차례
    eat_rate: {root: 0.018, meat: 0.0059259259, grass: 0.036}   # 땅속 = 풀 × 0.5(파는 시간), 고기 = 0.04 E/초 ÷ 0.9
    e_per_unit: {root: 0.15, meat: 0.9, grass: 0.05}
    has_hp: true
    hp_regen_per_day: 0.25      # [새][어림]
    shelter_enter: true
    bites: []
    bite_r: 0.0
    counter: true
    maturity_steps: 900         # 120 초
    sex: alternate              # 시작 개체는 번갈아(짝수 칸 차례 암컷), 새끼·다시 남은 Unit < 0.5
    female_frac: 0.5
    child_female_frac: 0.5
    max_founder_age_steps: 4500 # [어림] 5 × 성숙
    first_birth: [112.5, 0.0]   # t + 15 초
    mate_r: 5.0
    birth_r: 7.5
    birth_grace_steps: 150      # 출산 때 자격이 없으면 20 초까지 기다림
    pair_block: [run]
    birth_block: [run]
    pending_needs_parent: false # 대기 중: 살아 있음·사분면만
    child_ring: {center: midpoint, r0: 0.9, dr: 0.15, avoid_shelter: false}
    food_density_ref: 0.2       # [어림]
    food_here_ref: 0.2          # [어림]

reward:                         # 6절 — 세 종 같은 식
  alive: 0.01
  energy: 1.0                   # × Δ(E + R × C)
  birth: 10.0
  death: -10.0
  fallback_f:                   # 6-1 대비책 F — 사용자 승인(11-10), 관문에서 막히면 한 번 건다. 기본 끔
    enabled: false
    birth: 2.0                  # 켜면 출산 +2
    condition_total: 8.0        # + 성숙하고 E ≥ 0.7 인 스텝마다 8 / 2250
    condition_period: 2250
    e_min: 0.7

rules:                          # 7-5 규칙 두뇌 (관측값 문턱. 거리는 단위 — 두뇌 코드가 / pos_norm 으로 바꾼다)
  deer: {near: 15.0, facing_eval: 0.9, approach_far: 0.1, close: 10.0, approach_close: 0.15, shelter_edge: 8.0, free_min: 0.2, full_e: 0.9}
  boar: {near: 3.25, approach_run: 0.33, facing: 0.9, guard_hp: 0.55, young_size: 0.45, young_r: 2.0, flee_decisions: 6,
         approach_walk: 0.1, full_e: 0.9}   # approach_walk [어림]: '걸어서 다가옴' 문턱
  wolf: {eat_e: 0.98, hunt_e: 0.9, small_size: 0.47, stalk_r: 6.0, shelter_r_est: 5.5}   # shelter_r_est [어림]: '은신처 밖' 관측 대용
  hide: {eat_e: 0.3}

eval_mixed:                     # 8-1 J1 (학습 세계 꼴)
  steps: 9000
  wolf_counts: [2, 3, 4, 5, 6]  # 2 + (k mod 5)

train:                          # 7절
  seeds: [43000, 44000]         # 학습 세계 풀 [하, 상) — 시험·스모크는 이 범위를 쓰지 않는다
  reset_steps: 5000             # 세계 교체 (스텝), 엇갈림 (R8)
  worlds: {deer: 32, wolf: 120, boar: 96}
  n_steps: {deer: 32, wolf: 96, boar: 48}   # 롤아웃 = 학습 칸 × n_steps: 사슴 896 × 32 = 28,672 (S′ N) · 늑대 384 × 96 · 멧돼지 768 × 48 (모두 4,096 의 배수)
  wolf_shards: 3                # C0-9 등록 (11-12 S′, STATUS 3절): 같은 부하에서 조각 3 이 조각 2 보다 1.42 배 빠름 (11-11 처음 세계 1.46 배). 학습 전 등록 — 바꾸지 않음
  bundle_decisions:             # C0-9 등록 (11-12 S′, STATUS 3절) = 잰 결정/초 × 45 분 (0 바퀴: 먹이 3.5 시간 · 늑대 4 시간), 가까운 십만. 학습 전 등록 — 바꾸지 않음
    round0: {deer: 80300000, boar: 30300000, wolf: 38800000}    # 6,376 · 2,404 · 2,693 결정/초 (0 바퀴 꼴, 프로세스 4 개 함께)
    later: {deer: 19400000, boar: 7200000, wolf: 7300000}       # 7,199 · 2,659 · 2,704 결정/초 (1 바퀴 꼴: 이어 배우기 + npz 상대)
    speed_dps:                  # 위 결정 수의 근거 속도 = 밤 창 묶음 어림(× 1.1)·C0-10 벽시계 상한 (league_r9 / run_night / eval_r9)
      round0: {deer: 6376, boar: 2404, wolf: 2693}
      later: {deer: 7199, boar: 2659, wolf: 2704}
    # 11-11 등록(107 칸 세계) — 폐기: round0 150,000,000 / 44,500,000 / 54,100,000 · later 33,700,000 / 10,000,000 / 10,600,000
  wall_cap_factor: 2.0
  snapshot_every: {deer: 10000000, wolf: 5000000, boar: 5000000}
  model_seeds: {A: 0, B: 1}
  opponents:                    # 7-4
    round0: {rule: 1.0}
    round0_wolf_prey: {rule: 0.7, always_eat: 0.3}   # 늑대 묶음의 먹이 상대 (0 바퀴)
    later: {current: 0.5, past: 0.3, rule: 0.2}
    past_from: 0.5              # 예전 판 = Uniform{⌊V/2⌋, …, V − 1}
  opponent_stochastic: 0.75     # 상대 두뇌 행동: 확률 75% · 가장 높은 칸 25%
  ppo:
    batch_size: 4096
    n_epochs: 10
    learning_rate_round0: 0.0003
    learning_rate: 0.0001
    gamma: 0.997                # [C0-10] 후보 [0.997, 0.99] — 둘 다 넘으면 0.997
    gamma_candidates: [0.997, 0.99]
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    net: [64, 64]
    value_only_first_rollout: true
    torch_threads: 1
