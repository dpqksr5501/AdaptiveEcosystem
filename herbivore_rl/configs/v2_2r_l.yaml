# V2 설정 — v2.2r 탐색 팔 L (1순위): T1 + 반사 돌아보기 (수정 제안서 3.1 (나)·3.8, 10-03 R2).
#
# configs/v2_2r_t1.yaml 과 같은 세계에 look_back 하나만 켠다: 이번 스텝의 실제 보행이 정지이고 결정 때 창 안(포식자 안
# 보임 & threat_recency > theta)이면 heading ← 마지막 위협 방향(env_v2/world.py `_look_back`). 섭식·대사·시야는 정지
# 그대로(섭식 1.0, 대사 c_rest, 120°)다. RL 은 speed 로 창 안에서 멈출지를 고른다. 관측 8, 행동 5 (경계 행동 열 없음).
# 묻는 것: RL 이 창 안 정지를 배우나(B3_L = P(정지 | 창 안) − P(정지 | 평시), energy ≥ 0.5 표본, ≥ 0.1).
#   python train_v2.py --config configs/v2_2r_l.yaml --steps 20000000 --seed 20 --run-name v2_2r_l_s20
# 형식 규칙은 configs/v2.yaml 머리 주석과 같다.

version: "2.2r_l"

overrides:
  rand:
    pred_speed_mult: [0.6, 0.95]

features:
  speed:
    # configs/v2_1.yaml·v2_2.yaml 블록 그대로 (Gate E1-b 통과 계수 r2_5_ew0_5)
    enabled: true
    thresholds: [0.3333333333333333, 0.6666666666666666]
    gait_speed: [0.0, 0.4, 1.0]
    gait_eat: [1.0, 0.5, 0.0]
    c_rest: 0.7142857142857143
    c_move: 1.7857142857142858
    net_energy_reward: true
  vigilance:
    # configs/v2_2.yaml 블록 그대로 (Gate E2 V0, decay 0.95). action: false 라 threshold·eat_mult·fov_deg 는 쓰이지 않는다
    enabled: true
    threshold: 0.5
    decay: 0.95
    eat_mult: 0.0
    fov_deg: 360.0
    threat_flee: 0.0
  vigil_window:
    enabled: true
    action: false
    window_only: false
    look_back: true
    # 창 문턱 = Gate E2 의 θ (env_v2/world.py RECENT_THREAT, 놓친 뒤 13스텝)
    theta: 0.5

train:
  # v2.1·v2.2 와 같다. 경계 행동 열이 없어 init_action_bias 를 두지 않는다(speed 는 SB3 기본 편향 0, v2.1 과 같다)
  num_worlds: 8
  reset_interval: 4000
  rollout_world_steps: 256
