# 언리얼 통합 v3 모드 거울 (10-15 사용자 '언리얼에서 돌리는 게 파이썬에서 돌리는 것과 얼마나 비슷한지 확인'). 견주기 전용 세계이고
# 학습하지 않는다(부활 없음 세계는 env_v2/vec_env.py 가 받지 않는다). 파이썬 세계 하나 = 팀 레벨의 지역 무대 하나(Forest·Barren·Highland 중
# 하나)다. 실행기 results/v3/mirror/run_mirror.py, 언리얼 기록과 견주기 results/v3/mirror/compare_unreal.py.
#
# 무엇을 흉내 내나 (C++ 출처는 AdaptiveEcosystem/Source/AdaptiveEcosystem/AI/Policy/ — EcoPolicyV3IntegratedSubsystem.cpp 의
# MakeRegionWorldConfig·PlanStage·우리 은신처, EcoPolicyV3IntegratedProcessors.cpp 의 죽음 넘기기, EcoWorldV3.h Step 의 G 단계):
#   두뇌: R1b(ckpt/v3/v3_r1_g995_s3_20m.zip, 관측 18·마스크 판 2)를 argmax 로. 얼기는 막는다(아래 train.repertoire.allowed — C++
#     WorldAllowed[FREEZE] = 0, eco.IntegratedV3.NoFreeze 1. 실제 허용 = 모델 목록 ∩ 세계 목록, env_v2/rep_policy.py effective_allowed)
#   세계 = configs/v3_real1_night_on.yaml(R1b 세계 v3_r1_on + 늑대 밤잠 점진화 — C++ bRealismNight = eco.IntegratedV3.GradualNight 1)에서:
#     overrides.rand: 맵 한 변 60 단위(무대 120 m, C++ WorldSize = StageSizeUnits 60), 늑대 2마리(WolvesPerRegion 2), 속력 배수 0.8
#       (PredSpeedMult — 사슴 뛰기 900 cm/s × 0.8), 원거리형 없음(NumRanged 0), 먹이 재생 배수 1(FoodRegenMult 1.0)
#     overrides.pred_eat_cd 38 + threats.eat_in_place: 늑대가 잡은 자리에서 5초 서서 먹는다(PredEatCdOverride = WolfEatSteps() 38, bEatInPlace —
#       eco.IntegratedV3.WolfEatSeconds 5). 30초·60초 변형은 실행기 --wolf-eat-steps 225·450(반올림(초 ÷ 2/15초), 0.5 는 올림)
#     daynight.periods [900]: 하루 900스텝(60초 낮 + 60초 밤, DayPeriod 900, 박명 45 = TwilightSteps 45)
#     pred_sleep.nocturnal_frac [0, 0]: 야행성 없음(NumNocturnal 0), threats.player_frac 0: 플레이어형 위협 없음(bPlayerProxy false)
#     integrated_stage(env_v2/world.py 모듈 docstring '통합 무대'): 부활 없음(bRespawnDead false), 시작 위상 0(DayOffset 0 — t = 0 새벽 전환),
#       무대 1/4·3/4 은신처 4개 반경 6(ExtraCoverCount 4·ExtraCoverRadiusFrac 0.1), 늑대 잠행 1 + 추격 1(WolfSpecForOrdinal), 무대 시작 배치
#       (PlanStage: 늑대 모서리 (54, 54)·(6, 6), 사슴 무대 균등·늑대에게서 14.5 단위 밖), 시작 방향(조정자 yaw = 순번 × 2.399963)
#   사슴 수 N 은 실행기 --deer 가 밀도마다 덮는다(128·64·32·16, C++ DeerPerRegion). 피식 EMA 분모 = N(PredEmaDenominator = 계획한 사슴 수).
#   시작 에너지 0.5·번식 규칙(E > 0.9 → 0.5·쿨다운 200, 새끼 없음)·먹이 격자 식·재생 식은 이미 같다(골든 대조, export_golden_v3_world.py).
#
# 닫지 못한 차이:
#   - 난수열: C++ 는 자체 해시 난수(HashChain3, 세션 시드·RngStream = 지역 번호 + 1)로 먹이 격자 잡음·늑대 배회 선회를, 계획 난수로 시작 자리를
#     뽑고, 파이썬은 numpy 스트림(v1·기능 스트림)을 쓴다. 분포는 같고 궤적은 같지 않다 — 견주기는 통계로만 한다(언리얼 지역 무대 9장 대
#     파이썬 세계 여럿). 굶음은 먹이 지도 운이 크게 정한다(언리얼 128마리에서 지도 9장 중 2장이 첫 60초에 무너졌다)
#   - 결정 지연·밤잠 지연의 개체 키: C++ 세션 시드·StableAgentId, 파이썬 세계 시드·(슬롯, 세대)·슬롯. 분포는 같다
#   - 지형 제약 이동(FStepHooks/ConstrainStep): 비교 로그 12개 모두 '막힘 사슴 0 늑대 0' 이라 XY 동역학 차이는 없다(높이는 표시 전용)
#   - 팀 시계 동기(다시 맞춤 0번)·시체 2초 삭제·이주·웨이브·팀 1초 에너지 소모 끔: 동역학과 무관하거나 비교 조건에서 꺼져 있다
#   - 경계 거리 KeepAway: 커밋하지 않은 실험이다. 비교 로그(k0)는 끔이라 흉내 내지 않는다
#   - 기록 줄의 '산 수'는 프레임 끝 값이라 그 스텝의 죽음만큼 늦다. 실행기는 같은 꼴(스텝 첫머리 산 수)과 스텝 끝 값을 둘 다 적는다
# 시드: 탐색 32000~32099·33000~33099 만 쓴다(판정 시드는 쓰지 않는다).

version: "3.mirror1"

# v1 키: 포식자 속도 범위(v3_real1_night_on 은 [0.6, 0.95])를 통합 무대 값 0.8 하나로, 맵·늑대 수·원거리형·재생 배수를 고정한다. 폭 0 범위는
# uniform(a, a) = a 라 v1 스트림 뽑기 수는 그대로다(world_params·vec_env 균형 뽑기와 같은 순서). 은신처 비율 cover_frac 은 뽑기만 하고
# integrated_stage.cover_layout 이 덮는다. rand 의 나머지 하위 키는 v1 값 그대로다.
overrides:
  rand:
    world_size: [60.0, 60.0]
    predator_count: [2, 2]
    pred_speed_mult: [0.8, 0.8]
    ranged_frac: [0.0, 0.0]
    food_regen_mult: [1.0, 1.0]
  # 늑대 먹는 시간 5초 = 반올림(5 ÷ 2/15) = 38스텝(C++ WolfEatSteps). 실행기 --wolf-eat-steps 가 덮는다(30초 225, 60초 450)
  pred_eat_cd: 38

features:
  speed:
    enabled: true
    # 행동 idx 4 (sigmoid 뒤 [0,1]) → 보행 상태: a < 1/3 정지, a < 2/3 걷기, 그 이상 뛰기 (계획서 4.3).
    # 상태가 없는 고정 문턱이다(최소 유지 시간 K 없음, 10절 #3 — B8 이 0.5 를 넘으면 넣는다).
    # 1/3·2/3 의 float64 값을 그대로 적는다(repr(1/3), repr(2/3)).
    thresholds: [0.3333333333333333, 0.6666666666666666]
    # 상태별 속력 × herb_speed [정지, 걷기, 뛰기] (4.4 표). 정지는 0 이어야 한다(heading 유지).
    # 뛰기 1.0 = v1 속력. 포식자 속도 범위는 E1-b 결정(10-02)으로 ×0.6~0.95(원거리형 ×0.36~0.57, 위 overrides)다.
    # 걷기 0.4 는 모든 근접형보다 느리고 뛰기 1.0 은 모든 포식자보다 빠르다. 쫓기면 뛰어야 산다.
    gait_speed: [0.0, 0.4, 1.0]
    # 상태별 섭식 배수 [정지, 걷기, 뛰기] (4.4 표). env_v2/world.py `_eat` 의 want(흡수 가능량, 상한 food_eat_rate
    # 0.06)에 곱한다. 걷기 최대 섭취 0.03/스텝.
    gait_eat: [1.0, 0.5, 0.0]
    # 대사 drain = energy_drain × (c_rest + c_move·(v/herb_speed)²) (4.4). 기준은 "평시 에너지 예산을 v1 과 같게":
    # 걷기 대사 = v1 대사(c_rest + 0.4²·c_move = 1)와 c_rest/c_move = 0.4²(거리당 비용이 가장 낮은 속도
    # √(c_rest/c_move)·herb_speed = 걷기 속도)에서 c_rest 0.5, c_move 3.125 (제안). 대사 배수는 정지 0.5, 걷기 1,
    # 뛰기 3.625. Gate E1 은 뛰기 배수 R ∈ {2, 3.6, 6} 을 훑는다 — 걷기 1 을 지키면 c_move = (R − 1)/0.84,
    # c_rest = 1 − 0.16·c_move.
    # 10-02 Gate E1-b 통과(B1 r2_5_ew0_5, results/v2/e1/judge_e1b.md·report_b.md)로 R = 2.5 값으로 바꿨다:
    #   c_rest = (21 − 4·1.5)/21 = 15/21, c_move = 25·1.5/21 = 37.5/21 (gate_e1.metabolism(2.5) 의 float64 값 그대로).
    #   대사 배수는 정지 0.714, 걷기 1(= v1, 그대로), 뛰기 2.5. 걷기 1 고정은 지키고 c_rest/c_move = 0.4 라
    #   거리당 비용이 가장 낮은 속도는 √0.4 ≈ 0.63·herb_speed(걷기와 뛰기 사이)이고, 걷기와 뛰기의 거리당 대사가
    #   같다(1/0.4 = 2.5/1). 뛰기의 비용은 대사가 아니라 섭식 0(gait_eat)에서 온다.
    c_rest: 0.7142857142857143
    c_move: 1.7857142857142858
    # 에너지 보상 (4.5, 10절 #4): true = 순변화 e_new − e_prev (번식·리스폰 리셋 제외. 대사가 즉시 보상에 잡힌다),
    # false = v1 획득량 e_new − e_drained (먹이로 얻은 에너지만).
    net_energy_reward: true

  daynight:
    enabled: true
    # 하루 길이 T(스텝) 목록. reset 마다 하나를 고른다(계획서 4.9.2 {600, 900, 1800} = 80·120·240초, 낮·밤 1:1).
    # 통합 무대: 900 하나 — 60초 낮 + 60초 밤(C++ DayPeriod 900·TwilightSteps 45 = 0.05 × 900, 팀 시계와 같은 길이)
    periods: [900]
    # 전환 앞뒤 박명 폭(T 비율). 전환 순간 d = 0.5, 앞뒤 0.05·T 스텝(30·45·90)에 걸쳐 0 과 1 을 선형으로 잇는다.
    twilight: 0.05
    # 밤 효과 (1 − x·d) 의 x (계획서 4.9.2 (a)(b)(c), #21). Gate N (a2)·(a3)가 실패한 항은 0 으로 뺀다(사전 등록).
    #   detect_night: 초식의 포식자 탐지 반경 see_r·(1 − 0.5·d) (밤 10 < 포식자 시야 14). 동족 시야는 그대로다
    #   eat_night: 섭식 × (1 − 0.5·d) — 10-06 환경 확인 N(results/v2/v2_4/gate_n, N0 회차)에서 (a2) 밤/낮 섭취비가 0.878
    #     (C2, 기준 ≤ 0.8)로 실패해 사전 등록(PREREG 2절, #21)대로 0 으로 뺐다(제안값 0.5). 흡수 가능량 제한 때문에 섭취가
    #     대사 수요를 따라가 밤 섭식 감소가 하루 섭취를 거의 줄이지 못한다(계획서 4.9.2 예측대로)
    #   rest_night: 정지·비경계 개체의 휴식 대사 × (1 − 0.35·d) — N0 (a3) 통과(늘 정지 상수 CSTOP, t −14.99)
    #   detect_night 는 N0 (a1) 통과(도주 반경 see_r 상수 C2F, t 5.16)로 계약값 그대로다
    detect_night: 0.5
    #   v2.4s(10-07): 포식자가 밤에 자면 밤이 가장 안전한 식사 시간이 되므로, 초식도 밤에 잘 이유로 eat_night 을 0.9 로
    #     다시 켠다(밤 섭취 상한 ×0.1). 위 10-06 N0 의 0 은 v2.4 판정이다. v2.4s 환경 확인(results/v2/v2_4/s)에서 다시 잰다
    eat_night: 0.9
    rest_night: 0.35
    # 낮 고정 세계 비율. 판정 세계는 0 이다(학습 세계 configs/v2_4.yaml 은 0.2, #27).
    fixed_day_frac: 0.0
    # to_transition = 다음 전환까지 남은 스텝 / 900 (계약 상수 — 가장 긴 상 길이, 계획서 4.2)
    transition_norm: 900
    # 시작 상태 유도(탐침 대응 1회용, results/v2/v2_4/MEMO.md). 0 = 끔
    start_induce: 0.0
    # 휴식 할인을 은신처 안에서 멈춘 개체만 받나(v2.4b, 10-06 추가 — false = v2.4 그대로, features.py 규칙 5)
    rest_cover_only: true

  pred_sleep:
    enabled: true
    # 야행성 비율 q 범위 — reset 마다 q ~ U[하, 상], 포식자마다 확률 q 로 야행성(밤에도 v2.4 그대로 사냥). 나머지는 주행성
    # 통합 무대: 야행성 없음(C++ NumNocturnal 0 — 늑대는 모두 주행성, 밤에 잔다)
    nocturnal_frac: [0.0, 0.0]
    # 주행성 포식자가 자는 어둠 문턱(d ≥ 0.5 = 해 진 뒤): 멈추고 사냥하지 않고 초식 시야에 보이지 않는다(굴)
    sleep_dark: 0.5
    # 깨어 있는 주행성 포식자의 속력 × (1 − d) (박명에 느려진다)
    twilight_slow: true

  # ── v3 R0 (명세 AdaptiveEcosystem/Docs/RL_Policy/RL_V3_R0_SPEC.md, 사전 등록 results/v3/r0/PREREG.md) ──────────────
  # 아래 두 블록을 끄면(enabled: false) 위 v2.4s 세계와 비트 단위로 같다(tests/test_repertoire_v3.py).
  repertoire:
    enabled: true
    # 잠금(최소 유지, 스텝 = 0.133초, 명세 2절). 잠금이 끝나거나 사건이 생기면 결정 시점이다(행동을 강제하지 않는다)
    lock_graze: 12
    lock_flee: 8
    lock_freeze: 12
    # HIDE: 도착까지 최대 hide_travel_max 스텝 잠그고, 도착(웅크림)한 뒤 lock_hide 스텝 더 잠근다
    lock_hide: 12
    hide_travel_max: 40
    # SLEEP: 진입 3 → 최소 수면 60 → 기상 3 (기상 중에는 움직이지 못하고 결정도 받지 않는다, M4)
    sleep_enter: 3
    sleep_hold: 60
    sleep_wake: 3
    # M2 놀람: GRAZE → FLEE 처음 3스텝 속력 0 (FREEZE·HIDE → FLEE 는 0)
    startle_steps: 3
    # M1 정지 탐지: FREEZE·도착 HIDE·SLEEP 의 표적 선택 체감 거리 × max(은신 배수, 1.8). GRAZE 정지에는 주지 않는다
    c_still: 1.8
    # M6 은신 배수(은신처 안일 때, 행동별): 웅크린(도착) HIDE 2.5, GRAZE 1.5, SLEEP 2.5, 그 밖(FLEE·FREEZE·가는 중 HIDE) 1.
    # 표적 선택과 포획 판정에 모두 쓴다(c_still 은 표적 선택에만). SLEEP 2.5 는 10-07 결정(results/v3/r0/PREREG.md 변경 기록
    # (n)): 은신처(굴) 안에서 자는 개체는 웅크린 개체처럼 숨겨진다 — 사용자 설계 '밤엔 굴에서 잔다'. 1 이면 은신처 안 잠이
    # 밖 잠과 똑같이 들켜 잠자리를 고를 이유가 없다
    # R1: 웅크림 은신 배수 4.0 은 R0 보정 1회차(results/v3/r0/cal1/hide)에서 HIDE 가 통과한 값이다
    cover_mult_crouch: 4.0
    cover_mult_graze: 1.5
    cover_mult_sleep: 2.5
    cover_mult_other: 1.0
    # M5 고개 숙임: GRAZE 중 자기 포식자 탐지 반경 × 0.6. SLEEP 은 × 0.3
    graze_head_down: 0.6
    sleep_sight: 0.3
    # 휴식 할인은 SLEEP 전용: 은신처 안의 SLEEP 대사 × (1 − 0.6·d). daynight.rest_night(0.35)는 이 세계에서 쓰지 않는다
    sleep_rest: 0.6
    # GRAZE: 지금 셀 먹이 ≥ 0.06(food_eat_rate)이면 멈춰 먹고 아니면 걷는다. 조향 n(0.83·먹이 기울기 + 0.71·무리 + 1.35·분리),
    # FLEE 는 n(3·위협 반대 + 0.71·무리 + 1.35·분리)
    graze_eat_min: 0.06
    graze_forage: 0.83
    graze_cohesion: 0.71
    # 사건 문턱: E2 위협이 8 안으로 들어오거나 접근 관측 ≥ 0.9, E4 에너지 < 0.25, E5 어둠 0.5 통과
    event_near: 8.0
    event_approach: 0.9
    event_energy: 0.25
    event_dark: 0.5
    # 사건 결정 지연 0~3스텝(개체 번호 해시, 해질녘에 무리가 한꺼번에 바뀌지 않게)
    decision_jitter: 3
    # 추가 관측: threat_recency 감쇠(v2.2 의 0.95), 행동 경과 분모 60. R1 은 관측에 넣는다(관측 9 + 9 = 18칸, 명세 1절)
    recency_decay: 0.95
    steps_norm: 60
    obs_extra: true

  threats:
    enabled: true
    # M3 잠행-돌진형: 세계마다 p_stalk ~ U[0.3, 0.7](포식자마다 이 확률로 잠행형, 나머지는 기존 추격형). 표적 체감 거리 > 6 이면
    # × 0.3 으로 몰래 접근, ≤ 6 이면 × 1.5 로 최대 12스텝 돌진, 놓치면 30스텝 탈진(× 0.2). 속력은 × herb_speed
    stalk_frac: [0.3, 0.7]
    stalk_dist: 6.0
    stalk_speed: 0.3
    pounce_speed: 1.5
    pounce_steps: 12
    exhaust_speed: 0.2
    exhaust_steps: 30
    # 플레이어형 위협(사용자 결정 10-07): 세계의 절반에 하나, 밤에 자지 않는다. 모드 [배회 × 0.4, 잠행 접근 × 0.3, 돌진 × 1.3].
    # 배회·잠행 모드는 200~400스텝마다 새로 고른다(잠행 확률 0.5). 잠행 중 가장 가까운 개체의 체감 거리가 6 이하면 최대 20스텝
    # 돌진하고 30스텝 쉰다. 포획 거리는 근접형과 같은 1.0, 포획 뒤 쿨다운 30스텝.
    # (명세에 값이 없는 것 — 모드 길이 범위, 잠행 확률, 돌진 시작 거리, 휴식, 쿨다운 — 은 R0 시작값이다)
    # 통합 무대: 플레이어형 위협 없음(C++ bPlayerProxy false)
    player_frac: 0.0
    player_speeds: [0.4, 0.3, 1.3]
    player_mode_steps: [200, 400]
    player_stalk_p: 0.5
    player_charge_dist: 6.0
    player_charge_steps: 20
    player_rest_steps: 30
    player_catch_r: 1.0
    player_cooldown: 30
    # 늑대 먹는 시간(10-15, 선택 키 — env_v2/features.py OPTIONAL_KEYS): 잡은 뒤 쿨다운(위 overrides.pred_eat_cd 38)이 남은 늑대는 그 자리에
    # 서서 먹는다(속력 0, 방향 그대로 — C++ bEatInPlace). 잠행형 비율 stalk_frac 은 뽑기만 하고 아래 integrated_stage.wolf_kinds 가 덮는다
    eat_in_place: true

  # ── v3 현실성 1단계 (10-14 사용자 방향, 정의·식은 env_v2/world.py 모듈 docstring 'realism_*') ─────────────────────────────────
  # 블록을 지우거나 enabled: false 로 두면 그 규칙이 없는 v3_r1_on 세계와 비트 단위로 같다(tests/test_realism_v3.py). 난수 없음.
  # 늑대 식욕은 어느 규칙도 바꾸지 않는다(포만 없음 — 사용자 결정 '늑대는 과식하게 둔다'). 먹는 시간은 이 설정에서 38스텝이다(위 overrides).
  # (d) 늑대 밤잠 점진화(주행성만. 야행성·플레이어는 그대로 밤에 자지 않는다).
  #   눕기: 해 진 뒤(d ≥ pred_sleep.sleep_dark 0.5) 늑대마다 다른 지연(0~spread·τ 스텝)이 지나고, 지난 스텝에 사냥 중(표적 있음·
  #   잠행형 돌진·대치)이 아니고, 실거리 settle_r 안에 사슴이 없으면 걸음을 늦추기 시작해 ramp_steps 스텝 뒤에 눕는다(잠). 늦추는
  #   동안 사냥이 시작되거나 사슴이 다가오면 다시 일어난다. 깨어 있는 동안 속력 = max(1 − d, night_floor) × 활동도.
  #   깜깜하면(d ≥ hunt_dark) 새 사냥을 시작하지 않고 쫓던 사냥만 마저 끝낸다(표적·포획).
  #   깸: d < 0.5 가 된 뒤 같은 지연이 지나면 깨고 ramp_steps 스텝에 걸쳐 속력이 0 에서 다 오른다. 해 질 녘·새벽(d < 0.5)의 감속
  #   (1 − d)는 v3_r1_on 그대로다.
  #   현실 근거: 늑대는 해 질 녘에 사냥을 마저 끝내고 주위가 조용해지면 걸음을 늦추다 눕는다. 먹잇감이 가까이 있거나 쫓는 중이면
  #   눕지 않는다. 눈으로 사냥하는 주행성 사냥꾼은 깜깜해지면 새 사냥을 시작하지 않는다. 새벽에는 하나씩 깨어 몸을 풀며 천천히
  #   움직이기 시작한다.
  realism_night:
    enabled: true
    # 이 실거리 안에 사슴이 있으면 눕지 않는다(8단위 ≈ 16 m, repertoire.event_near 와 같다 — 냄새·소리가 닿는 거리)
    settle_r: 8.0
    # 완전히 어두워지면(d = 1, 해 진 뒤 τ 스텝) 새 사냥을 시작하지 않는다. 이것이 없으면 사슴이 많은 세계에서 늑대가 표적을 계속 새로
    # 잡아 밤새 깨어 사냥한다(보정 시드 20000~20019 측정: 어둠 업데이트의 49% 깨어 있음, 밤 피식 4.2배)
    hunt_dark: 1.0
    # 해 진 뒤 깨어 있는 늑대의 속력 배수 하한 = 해 지는 순간의 값(1 − 0.5). 어둠 속 사냥은 낮보다 더디다. 1 − sleep_dark 이하여야 한다
    # (그래야 해 질 녘·새벽의 (1 − d) 감속이 v3_r1_on 그대로다)
    night_floor: 0.5
    # 늑대마다 다른 잠·기상 지연의 최대 = floor(0.5 × τ) 스텝(τ = 박명 폭 30·45·90 → 15·22·45). 지연 = 세계 시드·늑대 번호 해시
    spread: 0.5
    # 눕기·깨기에 걸리는 스텝: 15스텝(2 s) 동안 활동도가 한 스텝에 1/15 씩 1 ↔ 0 으로 바뀐다
    ramp_steps: 15

  # ── 언리얼 통합 무대 거울 (10-15, 정의·식·C++ 출처는 env_v2/world.py 모듈 docstring '통합 무대') ─────────────────────────────────────
  # 설정 키로 맞출 수 없는 차이만 다룬다. 끔 값(respawn true, 나머지 null)이면 이 블록이 없는 세계와 비트 단위로 같다(tests/test_unreal_mirror.py).
  integrated_stage:
    enabled: true
    # (k) 부활 없음: 죽은 사슴은 그 자리에 시체로 남고 다음 스텝부터 관측(동족)·늑대 표적·먹이·이동·번식·밤잠 근처 판정에서 빠진다(C++
    # bRespawnDead false — 계약 12-3 '새 개체 = 새 StableAgentId'). 학습(vec_env)에는 쓰지 않는다
    respawn: false
    # (l) 피식 EMA 분모: null = 슬롯 수 N = 처음 놓은 사슴 수(C++ PredEmaDenominator = PlannedDeer)
    ema_den: null
    # (m) 시작 위상: t = 0 이 새벽 전환(d = 0.5)이고 450스텝 낮, 450스텝 밤(C++ DayOffset 0, 팀 시계 t = 0). 주행성 늑대는 자고 시작한다
    day_offset: 0
    # (n) 은신처: 무대 1/4·3/4 지점 원 4개, 반경 = clip(0.1 × 한 변, cover_r_min 4, cover_r_max 9) = 6 단위(12 m, 넓이 12.6%) — C++ ExtraCoverCount 4·
    # ExtraCoverRadiusFrac 0.1. 레벨 은신처는 넣지 않는다(통합 레벨 로그: 세 지역 모두 '레벨 0 + v3 4')
    cover_layout: quad
    cover_count: 4
    cover_r_frac: 0.1
    # (o) 늑대 구성: 슬롯 0 잠행-돌진형, 슬롯 1 근접 추격형, 모두 주행성(C++ WolfSpecForOrdinal — 순번 짝수 잠행)
    wolf_kinds: alternate
    # (p) 시작 배치(C++ PlanStage, 1 단위 = 2 m): 늑대는 무대 중심에서 (±0.4 × 한 변) 모서리 (+,+)·(−,−) = (54, 54)·(6, 6)(WolfStartCornerFrac
    # 0.4, 늑대끼리 1.5 × 28 m = 21 단위 밖), 사슴은 무대 균등 [1.5, 58.5]²(여유 3 m)·모든 늑대에게서 28 m + 1 m = 14.5 단위 밖(WolfMinStartDistCm
    # 2800 + 100)·서로 1.5 m = 0.75 단위 밖(DeerMinSpacingCm 150)
    start_layout: stage
    wolf_corner_frac: 0.4
    wolf_gap: 21.0
    deer_wolf_gap: 14.5
    deer_margin: 1.5
    deer_spacing: 0.75
    # (q) 시작 방향: 사슴 순번 i 는 i × 2.399963 rad, 늑대 순번 m 은 (m + 2) × 2.399963 rad(C++ AEcoCreatureIntegrationSpawner 의 yaw)
    head_layout: golden

train:
  # configs/v3_real1_night_on.yaml 과 같고 허용 목록에서 얼기만 뺐다. 이 세계는 학습하지 않는다(부활 없음 — vec_env 가 받지 않는다).
  num_worlds: 8
  reset_interval: 5000
  rollout_world_steps: 256
  repertoire:
    # 고를 수 있는 행동: 먹기·도망·숨기(C++ WorldAllowed[FREEZE] = 0, 사람 결정 10-15 (A)). R1b 모델 목록(얼기 포함) ∩ 이 목록 = 이 셋이라
    # 판정 롤아웃(rep_learned)이 FREEZE 를 늘 막는다(R3 설정과 같은 방식)
    allowed: [graze, flee, hide]
    # 아래 셋은 학습 전용이다(argmax 판정은 쓰지 않는다). R1 값 그대로 두고 이 목록으로 다시 재지 않았다
    epsilon: 0.05
    init_probs: [0.4, 0.15, 0.15, 0.15, 0.15]
    ent_coef_base: 0.00255643
    f_dec: 0.255643
